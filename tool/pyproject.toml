[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugbounty-ai"
version = "0.1.0"
description = "A modular, safety-first, AI-assisted bug bounty research and workflow management platform."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Mahadev Suryavanshi"}
]
keywords = [
    "security",
    "bug-bounty",
    "reconnaissance",
    "penetration-testing",
    "owasp",
    "security-research"
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "alembic>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
bugbounty = "app.cli.main:cli"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
